name: Refresh Profile Cards and Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/*.svg'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow requests numpy

      - name: Generate animated ASCII profile card
        env:
          GITHUB_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_PATH: assets/profile.svg
        run: python scripts/generate_card.py

      - name: Refresh stats and top languages SVGs
        run: |
          curl -s -L "https://github-readme-stats-eight-theta.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0b0f19&title_color=38bdf8&icon_color=a855f7&text_color=94a3b8" -o assets/github-stats.svg || true
          curl -s -L "https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=0b0f19&title_color=38bdf8&text_color=94a3b8" -o assets/top-langs.svg || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg assets/github-stats.svg assets/top-langs.svg
          git diff --staged --quiet || git commit -m "chore(auto): refresh profile cards and stats"
          git push
